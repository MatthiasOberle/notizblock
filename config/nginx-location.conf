    # Private Notizblock application, isolated PHP pool.
    location = /notizblock { return 302 /notizblock/; }
    location = /notizblock/ { rewrite ^ /notizblock/index.php last; }
    location = /notizblock/index.php {
        client_max_body_size 12m;
        client_body_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/notizblock/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/notizblock.sock;
        fastcgi_read_timeout 45s;
    }
    location = /notizblock/app.js { alias /opt/notizblock/public/app.js; }
    location = /notizblock/style.css { alias /opt/notizblock/public/style.css; }
    location /notizblock/ { return 404; }
